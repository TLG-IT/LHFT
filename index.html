
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Fatima Hotel Reception</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}


/* ==========================================
   FULL PORTRAIT DIGITAL SIGNAGE
   ========================================== */

#screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
    background: #000;
}


/* ==========================================
   PORTRAIT 9:16 VIDEO
   FIT ENTIRE SCREEN
   ========================================== */

#player {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 100vw;
    height: 177.7778vw;

    min-height: 100vh;
    min-width: 56.25vh;

    transform: translate(-50%, -50%);

    border: 0;
    display: block;
}


/* ==========================================
   HIDE CURSOR
   ========================================== */

body {
    cursor: none;
}

</style>

</head>


<body>

<div id="screen">

    <iframe
        id="player"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>

</div>


<script>

/* ==========================================
   ONLY VIDEO
   ========================================== */

const video = "Eh4eyYJ4D3Q";


/* ==========================================
   LOAD YOUTUBE SHORT
   ========================================== */

const player = document.getElementById("player");

player.src =
    "https://www.youtube.com/embed/" + video +
    "?autoplay=1" +
    "&mute=1" +
    "&controls=0" +
    "&rel=0" +
    "&modestbranding=1" +
    "&playsinline=1" +
    "&loop=1" +
    "&playlist=" + video;


/* ==========================================
   KEEP SCREEN FULL SIZE
   ========================================== */

function resizeScreen() {

    document.documentElement.style.width = "100%";
    document.documentElement.style.height = "100%";

    document.body.style.width = "100%";
    document.body.style.height = "100%";

}

window.addEventListener("resize", resizeScreen);

resizeScreen();

</script>

</body>

</html>
