<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Fatima Hotel Reception</title>

<style>

/* =========================================
   PORTRAIT DIGITAL SIGNAGE
   1080 x 1920
   ========================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

}


/* =========================================
   FULL PORTRAIT SCREEN
   ========================================= */

#screen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

}


/* =========================================
   VIDEO PLAYER
   ========================================= */

#player {

    position: absolute;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    border: none;

    margin: 0;
    padding: 0;

    display: block;

}

</style>

</head>


<body>


<div id="screen">

    <iframe
        id="player"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>

</div>


<script>


/* =========================================
   FATIMA HOTEL RECEPTION PLAYLIST
   ========================================= */

const videos =
"NVUsDQhtq6U,gv6KQlQK7tU,JuAuWy-dCkc,jcWhuuJ1X-U,FanL_bNsrSw";


/* =========================================
   LOAD YOUTUBE
   ========================================= */

const player = document.getElementById("player");

player.src =
    "https://www.youtube.com/embed/NVUsDQhtq6U" +

    "?autoplay=1" +
    "&mute=1" +
    "&controls=0" +
    "&rel=0" +
    "&modestbranding=1" +
    "&playsinline=1" +
    "&loop=1" +
    "&playlist=" + videos;


/* =========================================
   HIDE CURSOR
   ========================================= */

let timer;

document.addEventListener("mousemove", function () {

    document.body.style.cursor = "default";

    clearTimeout(timer);

    timer = setTimeout(function () {

        document.body.style.cursor = "none";

    }, 2000);

});

setTimeout(function () {

    document.body.style.cursor = "none";

}, 3000);

</script>

</body>

</html>
