<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Fatima Hotel Reception</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/*
==================================================
HORIZONTAL LED DISPLAY
Automatically fills the complete LED screen
regardless of the LED resolution/aspect ratio.
==================================================
*/

#player {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: none;

    display: block;

    background: #000;
}

</style>

</head>

<body>

<iframe
    id="player"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>


<script>

/*
==================================================
FATIMA HOTEL RECEPTION
YOUTUBE VIDEO PLAYLIST
==================================================
*/

const videos =
"NVUsDQhtq6U,gv6KQlQK7tU,JuAuWy-dCkc,jcWhuuJ1X-U,FanL_bNsrSw";


/*
==================================================
LOAD VIDEOS
==================================================
*/

const player = document.getElementById("player");

player.src =
    "https://www.youtube.com/embed/NVUsDQhtq6U" +
    "?autoplay=1" +
    "&mute=1" +
    "&controls=0" +
    "&rel=0" +
    "&modestbranding=1" +
    "&playsinline=1" +
    "&loop=1" +
    "&playlist=" + videos;


/*
==================================================
FULL SCREEN
==================================================
*/

function goFullscreen() {

    const element = document.documentElement;

    if (element.requestFullscreen) {
        element.requestFullscreen().catch(() => {});
    }

}

document.addEventListener("DOMContentLoaded", () => {

    setTimeout(goFullscreen, 1000);

});


/*
==================================================
HIDE MOUSE CURSOR
==================================================
*/

let cursorTimer;

function hideCursor() {

    document.body.style.cursor = "none";

}

document.addEventListener("mousemove", () => {

    document.body.style.cursor = "default";

    clearTimeout(cursorTimer);

    cursorTimer = setTimeout(hideCursor, 1500);

});


setTimeout(hideCursor, 3000);

</script>

</body>

</html>
