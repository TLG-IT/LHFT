<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Fatima Hotel Reception</title>

<style>

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

}


/* =========================================
   VERTICAL DIGITAL SIGNAGE
   ========================================= */

#screen {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #000;

}


/* =========================================
   VIDEO FIT
   ========================================= */

#player {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

    margin: 0;
    padding: 0;

    display: block;

}

</style>

</head>


<body>


<div id="screen">

    <iframe
        id="player"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
    </iframe>

</div>


<script>


/* =========================================
   FATIMA HOTEL RECEPTION VIDEOS
   ========================================= */

const videos =
"NVUsDQhtq6U,gv6KQlQK7tU,JuAuWy-dCkc,jcWhuuJ1X-U,FanL_bNsrSw";


/* =========================================
   YOUTUBE PLAYLIST
   ========================================= */

const player = document.getElementById("player");

player.src =
    "https://www.youtube.com/embed/NVUsDQhtq6U" +
    "?autoplay=1" +
    "&mute=1" +
    "&controls=0" +
    "&rel=0" +
    "&modestbranding=1" +
    "&playsinline=1" +
    "&loop=1" +
    "&playlist=" + videos;


/* =========================================
   HIDE MOUSE
   ========================================= */

let cursorTimer;

document.addEventListener("mousemove", function () {

    document.body.style.cursor = "default";

    clearTimeout(cursorTimer);

    cursorTimer = setTimeout(function () {

        document.body.style.cursor = "none";

    }, 2000);

});


setTimeout(function () {

    document.body.style.cursor = "none";

}, 3000);

</script>


</body>

</html>
